description: Lunasonde is a Techstars-backed deep-tech space company building a satellite
  constellation for subsurface Earth imaging. Its sensing technology aims to scan
  beneath the surface from orbit to detect groundwater, minerals, and other underground
  features, delivering the resulting geophysical data to mining, agriculture, water,
  and natural-resource customers. As of this profile the company exposes no public
  developer API, documentation portal, SDK, or machine-readable API surface; this
  record captures its verifiable web and domain-security footprint for the API Evangelist
  network.
